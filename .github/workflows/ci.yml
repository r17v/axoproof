name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Vet, Race Tests & Zero-CGo Build
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test -race ./...
          go build -o /tmp/axoproof ./cmd/axoproof
          /tmp/axoproof version
