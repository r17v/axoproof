name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Verify tests before release
        run: |
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go test ./...
          CGO_ENABLED=1 go test -race ./...

      - name: Cross-compile pure-Go release binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o dist/axoproof-darwin-arm64 ./cmd/axoproof
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o dist/axoproof-darwin-amd64 ./cmd/axoproof
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o dist/axoproof-linux-amd64 ./cmd/axoproof
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o dist/axoproof-linux-arm64 ./cmd/axoproof
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/axoproof-windows-amd64.exe ./cmd/axoproof
          GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o dist/axoproof-windows-arm64.exe ./cmd/axoproof
          cd dist && sha256sum axoproof-* > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
